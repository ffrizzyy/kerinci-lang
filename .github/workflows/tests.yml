name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: All offline suites
        run: python build.py
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Validate every dialect file
        run: python tools/cek_dialek.py --semua
      - name: Run the built single-file program
        run: python dist/krc.pyz examples/contoh.krc
      - name: Install the krc command
        run: |
          python -m pip install .
          krc --version

  release-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full offline suite
        run: python build.py
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Validate every dialect file
        run: python tools/cek_dialek.py --semua
      - name: Regenerate and check for a diff
        run: |
          python tools/buat_glosarium.py
          python make_highlight.py
          python tools/sinkron_tutorial.py --bangun koto-payang
          git diff --exit-code
      - name: Wheel smoke
        run: python tests/test_release.py
      - name: Install and run both dialects from outside the checkout
        run: |
          python -m pip install .
          test "$(krc --version)" = "KerinciLang 0.6.0"
          work="$(mktemp -d)"
          printf '# dialek: siulak\nnyetak "siulak"\n' > "$work/s.krc"
          printf '# dialek: koto-payang\nnytak "koto-payang"\n' > "$work/k.krc"
          cd "$work"
          test "$(krc s.krc)" = "siulak"
          test "$(krc k.krc)" = "koto-payang"
