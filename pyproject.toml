[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kerincilang"
version = "0.6.0"
description = "A multi-dialect programming language with Kerinci vocabulary (Siulak and Koto Payang)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["programming-language", "kerinci", "siulak", "koto-payang", "dialect", "language-preservation"]

[project.scripts]
krc = "kerincilang:main"

[tool.setuptools]
py-modules = ["kerincilang"]
packages = ["core", "dialects"]

[tool.setuptools.package-data]
core = ["*.json"]
dialects = ["*.json", "*.md"]
